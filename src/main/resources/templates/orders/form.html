<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-9"><div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5">
    <h1 class="page-title mb-1">Create Order</h1><p class="text-muted mb-4">Choose a customer and add one or more products. Prices and the total are calculated automatically.</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="@{/orders}" th:object="${order}" method="post" class="vstack gap-4">
        <div class="row g-3"><div class="col-md-8"><label for="customerId" class="form-label">Customer</label><select id="customerId" class="form-select" th:field="*{customerId}"><option value="">Select customer</option><option th:each="customer : ${customers}" th:value="${customer.id}" th:text="${customer.firstName + ' ' + customer.lastName + ' (' + customer.email + ')'}"></option></select><div class="text-danger small mt-1" th:errors="*{customerId}"></div></div>
            <div class="col-md-4"><label for="status" class="form-label">Status</label><select id="status" class="form-select" th:field="*{status}"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option></select><div class="text-danger small mt-1" th:errors="*{status}"></div></div></div>
        <div><div class="d-flex justify-content-between align-items-center mb-2"><h2 class="h5 mb-0">Order Items</h2><button id="add-item" type="button" class="btn btn-sm btn-outline-primary">Add Item</button></div>
            <div id="order-items" class="vstack gap-2"><div th:each="item, stat : *{items}" class="row g-2 align-items-end order-item"><div class="col-md-8"><label class="form-label" th:for="${'product-' + stat.index}">Product</label><select class="form-select" th:id="${'product-' + stat.index}" th:field="*{items[__${stat.index}__].productId}"><option value="">Select product</option><option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name + ' — ' + product.price}"></option></select><div class="text-danger small mt-1" th:errors="*{items[__${stat.index}__].productId}"></div></div>
                <div class="col-md-3"><label class="form-label" th:for="${'quantity-' + stat.index}">Quantity</label><input type="number" min="1" class="form-control" th:id="${'quantity-' + stat.index}" th:field="*{items[__${stat.index}__].quantity}"><div class="text-danger small mt-1" th:errors="*{items[__${stat.index}__].quantity}"></div></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger remove-item">×</button></div></div></div>
            <div class="text-danger small mt-1" th:errors="*{items}"></div>
        </div>
        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Create Order</button><a class="btn btn-outline-secondary" th:href="@{/orders}">Cancel</a></div>
    </form>
</div></div></div></div></main>
<template id="item-template"><div class="row g-2 align-items-end order-item"><div class="col-md-8"><label class="form-label">Product</label><select class="form-select product-select"><option value="">Select product</option><option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name + ' — ' + product.price}"></option></select></div><div class="col-md-3"><label class="form-label">Quantity</label><input type="number" min="1" class="form-control quantity-input"></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger remove-item">×</button></div></div></template>
<script>
    const items = document.getElementById('order-items');
    function numberItems() {
        items.querySelectorAll('.order-item').forEach((row, index) => {
            row.querySelector('select').name = `items[${index}].productId`;
            row.querySelector('input').name = `items[${index}].quantity`;
        });
    }
    document.getElementById('add-item').addEventListener('click', () => { items.append(document.getElementById('item-template').content.cloneNode(true)); numberItems(); });
    items.addEventListener('click', event => { if (event.target.classList.contains('remove-item') && items.children.length > 1) { event.target.closest('.order-item').remove(); numberItems(); } });
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
