<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="page-title mb-1">Orders</h1><p class="text-muted mb-0">Create orders and update their delivery status.</p></div><a class="btn btn-primary" th:href="@{/orders/new}">Create Order</a></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card shadow-sm border-0"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>#</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody>
        <tr th:if="${#lists.isEmpty(orders)}"><td colspan="7" class="text-center text-muted py-5">No orders found.</td></tr>
        <tr th:each="order : ${orders}"><td th:text="${order.id}"></td><td class="fw-semibold" th:text="${order.customer.firstName + ' ' + order.customer.lastName}"></td><td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></td>
            <td><span th:each="item, stat : ${order.orderItems}" th:text="${item.product.name + ' × ' + item.quantity + (stat.last ? '' : ', ')}"></span></td><td th:text="${order.totalAmount}"></td>
            <td><form th:action="@{'/orders/' + ${order.id} + '/status'}" method="post" class="d-flex gap-1"><select class="form-select form-select-sm" name="status"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == order.status}"></option></select><button class="btn btn-sm btn-outline-secondary">Save</button></form></td>
            <td class="text-end"><form th:action="@{'/orders/' + ${order.id} + '/delete'}" method="post" class="d-inline"><button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this order?')">Delete</button></form></td>
        </tr></tbody></table></div></div></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
