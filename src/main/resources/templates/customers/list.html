<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h1 class="page-title mb-1">Customers</h1><p class="text-muted mb-0">Manage the people who place orders.</p></div>
        <a class="btn btn-primary" th:href="@{/customers/new}">Add Customer</a>
    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card shadow-sm border-0"><div class="card-body p-0"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Name</th><th>Email</th><th>Phone</th><th class="text-end">Actions</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(customers)}"><td colspan="4" class="text-center text-muted py-5">No customers found.</td></tr>
            <tr th:each="customer : ${customers}">
                <td class="fw-semibold" th:text="${customer.firstName + ' ' + customer.lastName}"></td>
                <td th:text="${customer.email}"></td><td th:text="${customer.phone != null ? customer.phone : '-'}"></td>
                <td class="text-end"><a class="btn btn-sm btn-outline-secondary me-2" th:href="@{'/customers/' + ${customer.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/customers/' + ${customer.id} + '/delete'}" method="post" class="d-inline"><button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this customer?')">Delete</button></form>
                </td>
            </tr></tbody>
        </table>
    </div></div></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
