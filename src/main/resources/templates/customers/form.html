<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Customer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5">
    <h1 class="page-title mb-1" th:text="${pageTitle}">Customer Form</h1><p class="text-muted mb-4">Enter the customer's contact details.</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="${formAction}" th:object="${customer}" method="post" class="vstack gap-3">
        <div class="row g-3"><div class="col-md-6"><label for="firstName" class="form-label">First Name</label><input id="firstName" class="form-control" th:field="*{firstName}"><div class="text-danger small mt-1" th:errors="*{firstName}"></div></div>
            <div class="col-md-6"><label for="lastName" class="form-label">Last Name</label><input id="lastName" class="form-control" th:field="*{lastName}"><div class="text-danger small mt-1" th:errors="*{lastName}"></div></div></div>
        <div><label for="email" class="form-label">Email</label><input id="email" type="email" class="form-control" th:field="*{email}"><div class="text-danger small mt-1" th:errors="*{email}"></div></div>
        <div><label for="phone" class="form-label">Phone</label><input id="phone" type="tel" class="form-control" th:field="*{phone}"><div class="text-danger small mt-1" th:errors="*{phone}"></div></div>
        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary" th:text="${buttonLabel}">Save Customer</button><a class="btn btn-outline-secondary" th:href="@{/customers}">Cancel</a></div>
    </form>
</div></div></div></div></main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
